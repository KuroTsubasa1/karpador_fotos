<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Karpador Fotos Maskottchen">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="60%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </radialGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFD23F"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tail fin (right) -->
  <g filter="url(#softShadow)">
    <path d="M180 88 L212 60 L208 110 L212 158 L180 132 Z"
          fill="url(#finGrad)" stroke="#1A1B3A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M192 80 L192 138" stroke="#1A1B3A" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    <path d="M202 72 L202 146" stroke="#1A1B3A" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Body -->
  <path d="M30 110
           C 30 56, 90 30, 130 38
           C 175 46, 196 76, 196 110
           C 196 144, 175 174, 130 182
           C 90 190, 30 164, 30 110 Z"
        fill="url(#bodyGrad)" stroke="#1A1B3A" stroke-width="5" stroke-linejoin="round"/>

  <!-- White belly -->
  <path d="M50 138
           C 70 168, 130 178, 170 152
           C 168 168, 140 184, 110 184
           C 80 184, 56 172, 50 138 Z"
        fill="#FFF8E7" stroke="#1A1B3A" stroke-width="4" stroke-linejoin="round"/>

  <!-- Crown / dorsal fin -->
  <path d="M70 44
           L 86 14
           L 100 38
           L 116 10
           L 130 36
           L 146 16
           L 152 52 Z"
        fill="url(#finGrad)" stroke="#1A1B3A" stroke-width="4" stroke-linejoin="round"/>

  <!-- Side pectoral fin -->
  <path d="M88 138
           C 76 156, 80 174, 100 174
           C 112 168, 116 154, 110 142 Z"
        fill="#FFF8E7" stroke="#1A1B3A" stroke-width="4" stroke-linejoin="round"/>

  <!-- Whiskers -->
  <path d="M48 116 C 28 124, 24 144, 36 156"
        fill="none" stroke="#FFD23F" stroke-width="6" stroke-linecap="round"/>
  <path d="M52 122 C 36 132, 36 150, 48 162"
        fill="none" stroke="#1A1B3A" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Mouth -->
  <ellipse cx="46" cy="112" rx="14" ry="11" fill="#FF6B9D" stroke="#1A1B3A" stroke-width="4"/>
  <ellipse cx="46" cy="112" rx="6" ry="5" fill="#1A1B3A" opacity="0.55"/>

  <!-- Eye -->
  <circle cx="118" cy="96" r="30" fill="#FFFFFF" stroke="#1A1B3A" stroke-width="5"/>
  <!-- Camera aperture pupil -->
  <g transform="translate(118 96)">
    <circle r="20" fill="#1A1B3A"/>
    <g stroke="#FF7A1A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M0 -16 L 6 -4"/>
      <path d="M14 -8 L 4 0"/>
      <path d="M14 8 L 4 2"/>
      <path d="M0 16 L -6 4"/>
      <path d="M-14 8 L -4 0"/>
      <path d="M-14 -8 L -4 -2"/>
    </g>
    <circle r="8" fill="#FF7A1A"/>
    <circle r="4" fill="#FFE066"/>
    <circle cx="-3" cy="-3" r="2.4" fill="#FFFFFF"/>
  </g>

  <!-- Cheek blush -->
  <circle cx="78" cy="138" r="9" fill="#FF6B9D" opacity="0.55"/>
  <circle cx="156" cy="134" r="9" fill="#FF6B9D" opacity="0.55"/>

  <!-- Flash spark -->
  <g transform="translate(168 46)" opacity="0.95">
    <path d="M0 -14 L 3 -3 L 14 0 L 3 3 L 0 14 L -3 3 L -14 0 L -3 -3 Z"
          fill="#FFE066" stroke="#1A1B3A" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
