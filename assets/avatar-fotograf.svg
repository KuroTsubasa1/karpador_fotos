<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Karpador mit Kamera">
  <defs>
    <radialGradient id="afBody" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </radialGradient>
  </defs>

  <!-- Karpador head -->
  <path d="M14 64
           C 14 38, 36 22, 60 22
           C 84 22, 106 38, 106 64
           C 106 86, 84 100, 60 100
           C 36 100, 14 86, 14 64 Z"
        fill="url(#afBody)" stroke="#1A1B3A" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- White belly -->
  <path d="M22 78 C 38 96, 82 96, 98 78 C 96 92, 80 100, 60 100 C 40 100, 24 92, 22 78 Z"
        fill="#FFF8E7" stroke="#1A1B3A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Dorsal fin / crown -->
  <path d="M30 28 L 40 12 L 50 24 L 60 10 L 70 24 L 80 12 L 90 28 Z"
        fill="#FFD23F" stroke="#1A1B3A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Tail -->
  <path d="M104 50 L 118 40 L 116 64 L 118 88 L 104 78 Z"
        fill="#FFD23F" stroke="#1A1B3A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Right eye visible -->
  <circle cx="78" cy="58" r="11" fill="#FFFFFF" stroke="#1A1B3A" stroke-width="3"/>
  <circle cx="78" cy="58" r="6" fill="#1A1B3A"/>
  <circle cx="76" cy="56" r="1.6" fill="#fff"/>

  <!-- Mouth -->
  <ellipse cx="22" cy="66" rx="6" ry="5" fill="#FF6B9D" stroke="#1A1B3A" stroke-width="2.5"/>

  <!-- Camera body covering left side of face -->
  <g>
    <rect x="20" y="36" width="38" height="28" rx="4" fill="#1A1B3A" stroke="#1A1B3A" stroke-width="3" stroke-linejoin="round"/>
    <rect x="30" y="32" width="18" height="6" rx="1.5" fill="#1A1B3A" stroke="#1A1B3A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Lens -->
    <circle cx="39" cy="50" r="11" fill="#3A3B5C" stroke="#1A1B3A" stroke-width="3"/>
    <circle cx="39" cy="50" r="6.5" fill="#FF7A1A"/>
    <circle cx="39" cy="50" r="3" fill="#FFE066"/>
    <circle cx="37" cy="48" r="1.3" fill="#fff"/>
    <!-- Flash -->
    <rect x="49" y="38" width="6" height="4" rx="1" fill="#FFD23F" stroke="#1A1B3A" stroke-width="2"/>
  </g>

  <!-- Cheek -->
  <circle cx="92" cy="74" r="4.5" fill="#FF6B9D" opacity="0.6"/>
</svg>
