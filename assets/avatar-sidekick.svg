<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Wasser-Sidekick Maskottchen">
  <defs>
    <radialGradient id="asBody" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A8E6E2"/>
      <stop offset="60%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#1B9AAA"/>
    </radialGradient>
  </defs>

  <!-- Water droplet body -->
  <path d="M60 8
           C 60 8, 24 46, 24 72
           C 24 92, 40 108, 60 108
           C 80 108, 96 92, 96 72
           C 96 46, 60 8, 60 8 Z"
        fill="url(#asBody)" stroke="#1A1B3A" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Highlight -->
  <path d="M40 50
           C 36 60, 36 72, 40 80"
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- White lower belly -->
  <ellipse cx="60" cy="88" rx="26" ry="14" fill="#FFF8E7" stroke="#1A1B3A" stroke-width="2.8"/>

  <!-- Eyes -->
  <circle cx="48" cy="62" r="9" fill="#FFFFFF" stroke="#1A1B3A" stroke-width="3"/>
  <circle cx="48" cy="64" r="4.5" fill="#1A1B3A"/>
  <circle cx="46.5" cy="62.5" r="1.4" fill="#fff"/>

  <circle cx="74" cy="62" r="9" fill="#FFFFFF" stroke="#1A1B3A" stroke-width="3"/>
  <circle cx="74" cy="64" r="4.5" fill="#1A1B3A"/>
  <circle cx="72.5" cy="62.5" r="1.4" fill="#fff"/>

  <!-- Cheeks (pink) -->
  <circle cx="36" cy="78" r="5" fill="#FF6B9D" opacity="0.7"/>
  <circle cx="86" cy="78" r="5" fill="#FF6B9D" opacity="0.7"/>

  <!-- Smile -->
  <path d="M52 82 Q 60 90 70 82"
        fill="none" stroke="#1A1B3A" stroke-width="3" stroke-linecap="round"/>

  <!-- Tiny crown sparkle on top -->
  <g transform="translate(60 6)">
    <path d="M-6 4 L -2 -4 L 0 2 L 2 -4 L 6 4 Z"
          fill="#FFD23F" stroke="#1A1B3A" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Side splash drops -->
  <circle cx="14" cy="78" r="3" fill="#4ECDC4" stroke="#1A1B3A" stroke-width="2"/>
  <circle cx="108" cy="84" r="2.5" fill="#4ECDC4" stroke="#1A1B3A" stroke-width="2"/>
</svg>
